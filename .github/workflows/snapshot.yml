name: snapshot
on:
  schedule:
    - cron: "23 * * * *"   # hourly: copy any new grail commit, gate it, record it
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      HAS_WP: ${{ secrets.WP_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Snapshot the grail (read-only) and gate it
        id: snap
        run: python vault.py snapshot --out docs
      - name: Ask Software Heritage to archive the grail (permanent, independent of GitHub and of us)
        continue-on-error: true
        run: curl -fsS -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/kody-w/rapp-installer/" -o /dev/null
      - name: Re-verify every stored copy
        run: python vault.py verify --out docs
      - name: Record it
        run: |
          cp install.sh docs/install.sh
          git config user.name "grail-vault"
          git config user.email "grail-vault@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || { git commit -q -m "vault: $(python -c 'import json;print(json.load(open("docs/ledger.json"))["snapshots"][-1]["name"])')" && git push -q; }
      - name: Raise the alarm on a grail commit that failed the gates
        if: steps.snap.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.snap.outputs.failed }}
        run: |
          gh issue create --title "Grail commit $FAILED failed the vault gates" \
            --body "The grail's newest commit ($FAILED) did not pass. Last known good is unchanged: $(cat docs/latest.json). Details: docs/snapshots/$FAILED/manifest.json"
      - name: Copy the last known good to kodyw.com/grail
        if: env.HAS_WP == 'true'
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python publish_kodyw.py --out docs
          python vault.py beacon --out docs
          python publish_kodyw.py --out docs
          git add docs
          git diff --cached --quiet || { git commit -q -m "vault: kodyw.com copy of $(python -c 'import json;print(json.load(open("docs/latest.json"))["name"])')" && git push -q; }
